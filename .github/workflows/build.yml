name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (Q2-Q6)
    runs-on: ubuntu-latest
    # Newly added: report findings without blocking CI while tool versions stabilize
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          pip install ruff bandit yamllint
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xzf - -C /usr/local/bin actionlint

      - name: clang-format
        run: |
          find src include tests -name '*.hpp' -o -name '*.cpp' -o -name '*.h' 2>/dev/null | \
            xargs clang-format --dry-run --Werror --style=file

      - name: cppcheck
        run: |
          cppcheck --enable=warning,portability \
            --template='{file}:{line}: {severity}: {id}: {message}' \
            --inline-suppr \
            src/ include/ 2>&1 | tee cppcheck_output.txt || true
          ! grep -q ': error:' cppcheck_output.txt

      - name: ruff (tools/)
        run: ruff check tools/ --output-format=text

      - name: bandit (tools/)
        run: bandit -r tools/ -q --skip B101

      - name: actionlint
        run: actionlint .github/workflows/build.yml

      - name: yamllint
        run: yamllint -d relaxed .github/workflows/

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows/clang-cl/Ninja and Linux/g++/Ninja - the toolchains the
      # sibling renderer repos build on (both proven locally). macOS is
      # absent on purpose: Platform.cmake rejects it outright.
      matrix:
        os: [windows-latest, ubuntu-26.04]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # clang-cl may or may not ship on the runner image; like any choco
      # PATH change, it is not inherited by later steps. (Linux uses the
      # image's g++, proven in WSL - no install needed.)
      - name: Ensure clang-cl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command clang-cl -ErrorAction SilentlyContinue) {
            Write-Output 'clang-cl present on image'
          } else {
            choco install -y llvm
            "PATH=C:\Program Files\LLVM\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      # Interface library + C++ tests, no vcpkg and no Vulkan SDK required.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build

      # slang-math is the dependency base for everything above it, so its
      # suite runs in CI: the math contracts are pure C++ (no Vulkan). ctest
      # is serial without -j, matching the family's one-test-at-a-time rule.
      # test_tidy skips itself (exit 77) when clang-tidy is absent.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Q1 coverage lane in CI: the CPU suite runs here, so the llvm-cov report
  # measures real test coverage (locally proven: 90.65% lines). clang (not the
  # matrix's g++) because the lane consumes llvm-profdata/llvm-cov; the `llvm`
  # package provides the unversioned tool symlinks next to /usr/bin/clang.
  # Report-only while the lane stabilizes in CI (same pattern as the lint job).
  coverage:
    name: coverage (Q1)
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install toolchain (clang + LLVM coverage tools + ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm ninja-build

      # Header-only + GoogleTest via FetchContent: no vcpkg, no SDK.
      - name: Configure (instrumented)
        run: >
          cmake -S . -B build/coverage -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DSLANGMATH_COVERAGE=ON

      - name: Build (instrumented)
        run: cmake --build build/coverage

      # Runs the suite with LLVM_PROFILE_FILE set, merges the profiles and
      # prints the llvm-cov report for include/ (exit 77 = LLVM tools missing;
      # both outcomes stay non-blocking via continue-on-error).
      - name: Coverage report
        run: python tools/coverage.py --skip-build
